services:
  - type: web
    name: cabazes
    runtime: node
    repo: https://github.com/jacintobarbeira/cabazes
    plan: free
    region: frankfurt
    buildCommand: npx prisma generate && next build
    startCommand: npx prisma migrate deploy && npx tsx prisma/seed-prod.ts && next start
    healthCheckPath: /
    disk:
      name: cabazes-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/data/cabazes.db
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://cabazes.onrender.com
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
